<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#075E46">
  <meta name="description" content="Helping you understand your credit protection options and take the next step with confidence.">
  <title>Pratik — Credit Protection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;500&family=Poppins:wght@400;500;600;700&family=Sora:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Palette: Primary #075E46 · Secondary #E8FFF2 */
      --color-primary: #075E46;
      --color-secondary: #E8FFF2;

      /* Transparent liquid-glass navigation */
      --color-nav-bg: rgba(232, 255, 242, 0.35);
      --color-nav-border: rgba(255, 255, 255, 0.55);
      --color-nav-highlight: rgba(255, 255, 255, 0.7);
      --color-shadow: rgba(0, 0, 0, 0.35);
      --font-script: 'Great Vibes', cursive;
      --font-sans: 'Poppins', 'Helvetica Neue', Arial, sans-serif;

      --hero-text: var(--color-secondary);
      --button-text: var(--color-primary);
      --content-width: 1300px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { min-width: 320px; }

    body {
      min-width: 320px;
      margin: 0;
      background: #000;
      color: var(--color-secondary);
      font-family: Inter, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* === NAVIGATION — transparent liquid glass === */
    .site-header {
      position: absolute;
      z-index: 10;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      animation: fade-in-nav 0.8s ease-out both;
    }

    .nav-pill {
      display: flex;
      width: max-content;
      max-width: calc(100vw - 48px);
      min-height: 58px;
      align-items: center;
      gap: 36px;
      padding: 0 34px;
      border: 1px solid var(--color-nav-border);
      border-radius: 9999px;
      background: var(--color-nav-bg);
      box-shadow:
        inset 0 1px 0 var(--color-nav-highlight),
        inset 0 -1px 0 rgba(7, 94, 70, 0.12),
        0 8px 24px var(--color-shadow);
      font-family: var(--font-sans);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      backdrop-filter: blur(24px) saturate(180%);
    }

    .nav-toggle { display: none; }

    .nav-logo {
      flex: 0 0 auto;
      color: var(--color-primary);
      font-family: var(--font-script);
      font-size: 26px;
      line-height: 1;
      text-decoration: none;
      /* Optical centering: script fonts carry empty descender space below the
         baseline, so a mathematically centered box renders the glyph too high. */
      transform: translateY(0.1em);   /* ≈2.6px at 26px — tune between 0.05em and 0.15em */
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .nav-links a {
      color: var(--color-primary);
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.12em;
      opacity: 0.95;
      text-decoration: none;
      text-transform: uppercase;
      transition: opacity 180ms ease, text-shadow 180ms ease;
    }

    .nav-links a:hover,
    .nav-links a:focus-visible {
      opacity: 1;
      text-shadow: 0 0 8px rgba(7, 94, 70, 0.4);
    }

    /* === HERO === */
    .hero {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      min-height: 100vh;
      min-height: 100dvh;
      color: var(--hero-text);
      background: #E8FFF2;
      background: linear-gradient(180deg, rgba(232, 255, 242, 1) 0%, rgba(87, 199, 133, 1) 50%, rgba(7, 94, 70, 1) 100%);
    }

    .hero__inner {
      position: relative;
      width: min(var(--content-width), calc(100% - 60px));
      min-height: inherit;
      margin-inline: auto;
    }

    .hero__intro {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 15px;
      width: 364px;
      margin-left: 80px;
      padding-top: 300px;
      transform: translateY(10%);
    }

    .hero__role {
      margin: 0;
      font-family: Sora, sans-serif;
      font-size: 26px;
      font-weight: 400;
      line-height: 1.32;
      text-wrap: balance;
    }

    .hero__details { display: contents; }

    .hero__description {
      margin: 0;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.5;
      text-wrap: pretty;
    }

    .hero__button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-width: 158px;
      min-height: 52px;
      padding: 13px 23px;
      border: 1px solid var(--hero-text);
      border-radius: 999px;
      background: var(--hero-text);
      color: var(--button-text);
      font-size: 16px;
      font-weight: 500;
      line-height: 24px;
      text-decoration: none;
      transition: background .2s, color .2s;
    }

    .hero__button:hover {
      background: var(--button-text);
      color: var(--hero-text);
    }
    .hero__button:focus-visible { outline: 3px solid var(--color-secondary); outline-offset: 5px; }

    .hero__visual { position: absolute; inset: 0; pointer-events: none; }

    .hero__name {
      position: absolute;
      z-index: 1;
      left: 50%;
      bottom: 80px;
      transform: translate(-50%, -5%);
      margin: 0;
      width: 1193px;
      color: var(--hero-text);
      font-family: Sora, sans-serif;
      font-size: 250px;
      font-weight: 400;
      line-height: .9;
      letter-spacing: .19em;
      text-align: center;
      white-space: nowrap;
    }

    /* F7.png is a tall 528×1936 transparent cutout: keep its natural aspect
       and anchor it to the bottom instead of cover-cropping it. */
    .hero__portrait {
      position: absolute;
      z-index: 3;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      display: block;
      height: 94%;
      width: auto;
    }

    /* Desktop and tablet: flank the centered portrait with the intro copy. */
    @media (min-width: 810px) {
      .hero__intro {
        --hero-side-gap: clamp(110px, min(16vw, 18vh), 190px);
        position: absolute;
        inset: 0;
        display: block;
        width: auto;
        margin: 0;
        padding: 0;
        transform: none;
      }
      .hero__details {
        position: absolute;
        top: 22%;
        right: calc(50% + var(--hero-side-gap));
        left: auto;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 15px;
        text-align: center;
        width: min(364px, calc(50% - var(--hero-side-gap) - 16px));
        height: clamp(180px, 30vh, 300px);
        padding: 24px;
        border: 0;
        border-radius: 24px;
        color: var(--color-primary);
        background: rgba(232, 255, 242, 0.58);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 16px 40px rgba(0, 0, 0, 0.12);
        -webkit-backdrop-filter: blur(32px) saturate(180%);
        backdrop-filter: blur(32px) saturate(180%);
      }
      .hero__details--right {
        right: auto;
        left: calc(50% + var(--hero-side-gap));
      }
      .hero__details--right .hero__description { text-align: left; }
      .hero__details .hero__button {
        border: 0;
        background: rgba(232, 255, 242, 0.2);
        color: var(--color-primary);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.24);
        -webkit-backdrop-filter: blur(12px) saturate(160%);
        backdrop-filter: blur(12px) saturate(160%);
      }
      .hero__details .hero__button:hover {
        background: rgba(232, 255, 242, 0.3);
        color: var(--color-primary);
      }
    }

    /* Tablet: keep the introduction aligned with the visible P. */
    @media (min-width: 810px) and (max-width: 1359.98px) {
      .hero__role { font-size: 24px; }
      .hero__name { bottom: 60px; font-size: 120px; }
    }

    /* Short desktop viewports: keep the whole hero inside the first screen. */
    @media (min-width: 1360px) and (max-height: 740px) {
      .hero__name { bottom: 56px; font-size: 170px; }
    }

    /* Mobile: portrait/name first, credit protection content below.
       The hero fills at least one viewport and can scroll on short screens. */
    @media (max-width: 809.98px) {
      .hero {
        display: flex;
        flex-direction: column;
        overflow: visible;
        padding: 112px 16px 24px;
        padding: max(112px, calc(env(safe-area-inset-top) + 82px)) 16px max(24px, env(safe-area-inset-bottom));
      }
      .hero__inner {
        display: flex;
        flex-direction: column;
        gap: 20px;
        gap: clamp(16px, 4vh, 30px);
        width: 100%;
        flex: 1 0 auto;
        min-height: 0;
      }
      .hero__visual {
        position: relative;
        inset: auto;
        order: 0;
        width: 100%;
        flex: 1 1 auto;
        min-height: 140px;
        min-height: clamp(140px, 24vh, 190px);
      }
      .hero__portrait { width: auto; height: 100%; }
      .hero__name {
        top: 57%;
        bottom: auto;
        width: 100%;
        font-size: calc((100vw - 40px) / 5.5);
        line-height: 1;
      }
      .hero__intro {
        order: 1;
        width: 100%;
        margin-left: 0;
        padding-top: 0;
      }
      .hero__intro {
        display: flex;
        flex-direction: column;
        gap: 15px;
        padding: 24px;
        border: 0;
        border-radius: 24px;
        color: var(--color-primary);
        background: rgba(232, 255, 242, 0.58);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 16px 40px rgba(0, 0, 0, 0.12);
        -webkit-backdrop-filter: blur(32px) saturate(180%);
        backdrop-filter: blur(32px) saturate(180%);
      }
      .hero__details,
      .hero__details--right { display: contents; }
      .hero__role {
        font-size: 22px;
        font-size: clamp(18px, 5.6vw, 22px);
        text-wrap: initial;
      }
      .hero__button { min-width: 0; }
    }

    /* === NAVIGATION RESPONSIVE === */
    @media (max-width: 1024px) {
      .nav-pill { gap: 22px; padding: 0 24px; }
      .nav-links { gap: 20px; }
    }

    @media (max-width: 809.98px) {
      .site-header {
        top: 20px;
        top: max(20px, env(safe-area-inset-top));
        right: 16px;
        right: max(16px, env(safe-area-inset-right));
        left: 16px;
        left: max(16px, env(safe-area-inset-left));
        transform: none;
        width: auto;
        animation-name: fade-in-up;
      }
      .nav-pill {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        width: 100%;
        min-height: 54px;
        gap: 0 12px;
        padding: 0 12px 0 18px;
        border-radius: 28px;
        transition: border-radius 260ms ease;
      }
      .nav-logo { align-self: center; }
      .nav-toggle {
        display: inline-flex;
        width: 44px;
        height: 44px;
        flex: 0 0 auto;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 4px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: rgba(232, 255, 242, 0.52);
        color: var(--color-primary);
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .nav-toggle:focus-visible { outline: 3px solid var(--color-primary); outline-offset: 2px; }
      .nav-toggle__line {
        display: block;
        width: 20px;
        height: 2px;
        border-radius: 2px;
        background: currentColor;
        transition: transform 260ms cubic-bezier(.2, .8, .2, 1), opacity 180ms ease;
      }
      .nav-toggle[aria-expanded="true"] .nav-toggle__line:first-child { transform: translateY(6px) rotate(45deg); }
      .nav-toggle[aria-expanded="true"] .nav-toggle__line:nth-child(2) { opacity: 0; }
      .nav-toggle[aria-expanded="true"] .nav-toggle__line:last-child { transform: translateY(-6px) rotate(-45deg); }
      .nav-links {
        grid-column: 1 / -1;
        display: grid;
        gap: 0;
        min-width: 0;
        max-height: 0;
        margin: 0;
        overflow: hidden;
        opacity: 0;
        visibility: hidden;
        transform: translateY(-8px);
        transition: max-height 320ms cubic-bezier(.2, .8, .2, 1), opacity 200ms ease, transform 260ms ease, visibility 0s linear 320ms;
        list-style: none;
      }
      .nav-pill.is-open .nav-links {
        max-height: 360px;
        padding-block: 8px 12px;
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
        transition: max-height 320ms cubic-bezier(.2, .8, .2, 1), opacity 200ms ease, transform 260ms ease, visibility 0s;
      }
      .nav-links a {
        display: block;
        min-height: 44px;
        padding: 13px 8px;
        border-top: 1px solid rgba(7, 94, 70, 0.12);
        font-size: 12px;
        line-height: 18px;
      }
    }

    @media (max-width: 380px) {
      .nav-pill { padding-right: 10px; padding-left: 14px; }
      .nav-toggle { width: 42px; height: 42px; }
    }

    /* === KEYFRAMES === */
    @keyframes fade-in-nav {
      from { opacity: 0; transform: translate(-50%, 16px); }
      to   { opacity: 1; transform: translate(-50%, 0); }
    }

    @keyframes fade-in-up {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* JS adds this class only after the content is ready to animate. */
    .hero.is-entering .hero__intro { animation: intro-in .65s ease both; }
    .hero.is-entering .hero__portrait { animation: portrait-in .8s ease both; }
    @keyframes intro-in {
      from { opacity: 0; translate: 0 16px; }
      to { opacity: 1; translate: 0 0; }
    }
    @keyframes portrait-in {
      from { opacity: 0; translate: 0 24px; }
      to { opacity: 1; translate: 0 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .nav-pill,
      .nav-toggle__line,
      .nav-links { transition: none; }
      .hero.is-entering .hero__intro,
      .hero.is-entering .hero__portrait { animation: none; }
      .hero__button { transition: none; }
      .site-header { animation: none; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="nav-pill" aria-label="Main navigation">
      <a class="nav-logo" href="#home" aria-label="Pratik home">P.</a>
      <button class="nav-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="primary-navigation">
        <span class="nav-toggle__line" aria-hidden="true"></span>
        <span class="nav-toggle__line" aria-hidden="true"></span>
        <span class="nav-toggle__line" aria-hidden="true"></span>
      </button>
      <ul class="nav-links" id="primary-navigation">
        <li><a href="#work">Work</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#skills">Skills</a></li>
        <li><a href="#education">Education</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="hero" id="home" aria-labelledby="hero-name">
      <div class="hero__inner">
        <div class="hero__visual">
          <h1 class="hero__name" id="hero-name">PRATIK</h1>
          <img
            class="hero__portrait"
            src="F7.png"
            alt="Pratik, Credit Protection Representative"
            width="528"
            height="1936"
            fetchpriority="high"
            decoding="async"
          >
        </div>
        <div class="hero__intro">
          <div class="hero__details">
            <h2 class="hero__role">Credit Protection Representative</h2>
          </div>
          <div class="hero__details hero__details--right">
            <p class="hero__description">Helping you understand your credit protection options and take the next step with confidence.</p>
            <!-- Replace /contact with your own contact page, email, or booking URL. -->
            <a class="hero__button" href="/contact">Let’s talk</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const hero = document.querySelector('.hero');
      const nav = document.querySelector('.nav-pill');
      const navToggle = document.querySelector('.nav-toggle');
      const navLinks = document.querySelector('.nav-links');
      const name = document.querySelector('.hero__name');
      const visual = document.querySelector('.hero__visual');
      const mobile = window.matchMedia('(max-width: 809.98px)');
      const canvas = document.createElement('canvas');
      const context = canvas.getContext('2d');

      function setNavOpen(open, returnFocus = false) {
        nav.classList.toggle('is-open', open);
        navToggle.setAttribute('aria-expanded', String(open));
        navToggle.setAttribute('aria-label', open ? 'Close navigation menu' : 'Open navigation menu');
        if (returnFocus) navToggle.focus();
      }

      navToggle.addEventListener('click', () => {
        setNavOpen(navToggle.getAttribute('aria-expanded') !== 'true');
      });
      navLinks.addEventListener('click', (event) => {
        if (event.target.closest('a')) setNavOpen(false);
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && navToggle.getAttribute('aria-expanded') === 'true') {
          setNavOpen(false, true);
        }
      });
      document.addEventListener('click', (event) => {
        if (!nav.contains(event.target)) setNavOpen(false);
      });
      mobile.addEventListener('change', (event) => {
        if (!event.matches) setNavOpen(false);
      });

      // Fit the name to the available mobile width, including letter spacing.
      function fitMobileName() {
        if (!mobile.matches) {
          name.style.removeProperty('font-size');
          return;
        }
        if (!context) return;
        context.font = '400 100px Sora';
        const text = name.textContent.trim();
        const glyphWidth = context.measureText(text).width / 100;
        const spacingWidth = text.length * 0.19;
        const availableWidth = visual.clientWidth;
        name.style.fontSize = (availableWidth / (glyphWidth + spacingWidth)) + 'px';
      }

      fitMobileName();
      if ('ResizeObserver' in window) {
        new ResizeObserver(fitMobileName).observe(visual);
      } else {
        window.addEventListener('resize', fitMobileName, { passive: true });
      }
      if (document.fonts) document.fonts.ready.then(fitMobileName);
      mobile.addEventListener('change', fitMobileName);

      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        requestAnimationFrame(() => hero.classList.add('is-entering'));
      }
    })();
  </script>
</body>
</html>
